[project]
name = "clinikehr"
version = "0.3.0"
description = "Official Python client for the ClinikEHR API (api.clinikehr.com)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bettar Platforms, Inc." }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]
keywords = ["clinikehr", "ehr", "healthcare", "hipaa", "sdk", "fhir", "clinical-data", "openapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.clinikehr.com"
Documentation = "https://docs.clinikehr.com"
Repository = "https://github.com/clinikehr/sdk-python"
Issues = "https://github.com/clinikehr/sdk-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "respx>=0.21"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinikehr = ["py.typed", "_generated/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
